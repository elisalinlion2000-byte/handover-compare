<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交班文件對照</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky document chips, then one long column per document: sections in order, SERP path card, questions. Single light theme. */
:root {
  --bg: #F6F4EF;
  --panel: #FBFAF7;
  --line: #E0DCD2;
  --ink: #16212E;
  --muted: #5B6470;
  --accent: #B5441A;
  --dark: #16212E;
  --lion: #EF3545;
  --font: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.6; }
body { padding-bottom: 56px; }
header { padding: 24px 16px 12px; max-width: 1100px; margin: 0 auto; }
header h1 { margin: 0; font-size: 26px; line-height: 1.3; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.chips-wrap { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; max-width: 1100px; margin: 0 auto; scrollbar-width: thin; }
.chip { flex: none; font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.chip[aria-selected="true"] { background: var(--dark); color: #F6F4EF; border-color: var(--dark); font-weight: 700; }
button:focus-visible, .zoomable:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 28px; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
.title-row h2 { margin: 0; font-size: 24px; }
.timeline { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 15px; }
.timeline b { color: var(--accent); }
.path { background: var(--dark); color: #F6F4EF; border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
.path .lab { font-size: 14px; color: #F2A65A; font-weight: 700; }
.path .val { font-size: 18px; font-weight: 500; overflow-wrap: anywhere; }
.path .sub { font-size: 14px; color: #C9D1DB; }
.paths { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
section.sec { display: flex; flex-direction: column; gap: 12px; }
section.sec > h3 { margin: 0; font-size: 19px; padding-left: 10px; border-left: 4px solid var(--accent); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid.wide { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
@media (max-width: 520px) { .grid, .grid.wide { grid-template-columns: 1fr; } }
figure { margin: 0; display: flex; flex-direction: column; gap: 8px; }
figcaption { font-size: 15px; color: var(--muted); }
.frame { background: #ECE8DF; border-radius: 12px; padding: 10px; }
.frame img { display: block; width: 100%; border-radius: 6px; background: #fff; }
.zoomable { cursor: zoom-in; }
.ph { border: 2px dashed #B8B2A4; background: var(--bg); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); font-size: 15px; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.note { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 12px 16px; font-size: 16px; }
details.more { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; }
details.more summary { cursor: pointer; font-weight: 700; font-size: 16px; }
details.more .grid { margin-top: 14px; }
.info { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.card h3 { margin: 0 0 6px; font-size: 15px; color: var(--accent); }
.card p { margin: 0; font-size: 16px; }
.card .todo { color: var(--muted); }
.asks { background: var(--dark); color: #F6F4EF; border-radius: 12px; padding: 18px 20px; }
.asks h3 { margin: 0 0 8px; font-size: 16px; color: #F2A65A; }
.asks ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 4px; }


.tables { display: flex; flex-direction: column; gap: 28px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.tablewrap table { border-collapse: collapse; width: 100%; min-width: 820px; font-size: 15px; }
.tablewrap th, .tablewrap td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.tablewrap thead th { background: var(--dark); color: #F6F4EF; font-size: 14px; white-space: nowrap; }
.tablewrap tbody th { font-weight: 700; white-space: nowrap; }
.tablewrap tbody tr:last-child th, .tablewrap tbody tr:last-child td { border-bottom: 0; }
.tablewrap .todo { color: var(--muted); }
.tablewrap .sub { color: var(--muted); font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.vtabs { display: flex; flex-wrap: wrap; gap: 8px; }
.vtab { font: inherit; font-size: 16px; font-weight: 500; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.vtab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

/* Lightbox */
.lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(22,33,46,.94); display: none; flex-direction: column; }
.lightbox.open { display: flex; }
.lightbox .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; color: #F6F4EF; font-size: 15px; }
.close { font: inherit; border: 1px solid #F6F4EF; background: transparent; color: #F6F4EF; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
.lightbox .scroll { flex: 1; overflow: auto; padding: 0 12px 24px; }
.lightbox img { display: block; width: 100%; max-width: 1000px; margin: 0 auto; cursor: zoom-in; background: #fff; }
.lightbox img.big { width: 240%; max-width: none; cursor: zoom-out; }

/* Daily report demo (導領平台日報表) */
.demo-wrap { display: flex; flex-direction: column; gap: 10px; }
.demo-banner { font-size: 14px; color: var(--muted); }
.lp { position: relative; margin: 0 auto; max-width: 560px; width: 100%; background: #F0F0F0; border: 1px solid #D9D9D9; border-radius: 14px; overflow: hidden; color: #333; font-size: 15px; }
.lp-top { background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; box-shadow: 0 1px 4px rgba(0,0,0,.12); position: relative; z-index: 1; }
.lp-logo { font-weight: 700; font-size: 17px; color: #4a4a4a; display: flex; align-items: center; gap: 6px; }
.lp-logo i { width: 22px; height: 22px; background: var(--lion); border-radius: 6px 12px 6px 12px; display: inline-block; }
.lp-nav { color: #666; font-size: 12px; }
.lp-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.lp-card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
.lp-info { padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; position: relative; }
.lp-info dt { color: #888; margin: 0; }
.lp-info dd { margin: 0; overflow-wrap: anywhere; }
.lp-status { position: absolute; right: 14px; top: 10px; color: var(--lion); display: flex; align-items: center; gap: 6px; }
.lp-status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--lion); display: inline-block; }
.lp-day { background: #FDE8EA; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.lp select, .lp input[type=text], .lp textarea { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid #BDBDBD; border-radius: 6px; background: #fff; color: #333; }
.lp textarea { min-height: 84px; resize: vertical; }
.lp-tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
.lp-tab { font: inherit; border: 0; background: #fff; color: var(--lion); padding: 12px 4px; cursor: pointer; }
.lp-tab[aria-selected="true"] { background: var(--lion); color: #fff; }
.lp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lp-head h4 { margin: 0; font-size: 16px; font-weight: 400; color: #555; }
.lp-actions { display: flex; gap: 8px; }
.lp-btn { font: inherit; font-size: 14px; border: 1px solid var(--lion); background: var(--lion); color: #fff; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.lp-btn.ghost { background: #fff; color: var(--lion); }
.lp-btn.small { padding: 5px 12px; }
.lp-item-h { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 0; border-bottom: 1px solid #EEE; flex-wrap: wrap; }
.lp-badge { background: var(--lion); color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 0 4px 4px 0; align-self: center; }
.lp-bar { width: 4px; height: 22px; background: var(--lion); border-radius: 0 2px 2px 0; }
.lp-name { flex: 1; min-width: 140px; background: #F0F0F0; border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; }
.lp-chk { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.lp-ud { display: flex; }
.lp-ud button { font: inherit; border: 0; background: #EEE; width: 34px; height: 34px; cursor: pointer; color: #444; }
.lp-ud button:first-child { border-radius: 6px 0 0 6px; }
.lp-ud button:last-child { border-radius: 0 6px 6px 0; border-left: 1px solid #DDD; }
.lp-ud button:disabled { color: #BBB; cursor: default; }
.lp-sec { padding: 12px 14px; border-bottom: 1px solid #EEE; display: flex; flex-direction: column; gap: 10px; }
.lp-sec h5 { margin: 0; font-size: 14px; font-weight: 400; color: #888; }
.lp-times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lp-times label { display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.lp-dim { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lp-dim .t { font-weight: 700; }
.lp-dim .d { font-size: 12px; color: #777; display: block; font-weight: 400; }
.lp-stars { display: flex; align-items: center; gap: 4px; flex: none; font-size: 12px; color: #777; }
.lp-stars button { font: inherit; font-size: 26px; line-height: 1; border: 0; background: transparent; padding: 0 1px; cursor: pointer; color: #D6D6D6; }
.lp-stars button[aria-checked="true"], .lp-stars button.on { color: #F5A800; }
.lp-photo { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #EEE; color: #555; }
.lp-photo label { cursor: pointer; }
.lp-foot { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; }
.lp-trash { font: inherit; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--lion); color: #fff; cursor: pointer; }
.lp-trash:disabled { background: #CFCFCF; cursor: default; }
.lp-submit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lp-submit .lp-btn { padding: 12px; font-size: 15px; }
.lp-toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(22,33,46,.92); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 4; }
.lp-modal { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 3; display: flex; align-items: center; justify-content: center; padding: 20px; }
.lp-dialog { background: #fff; border-radius: 12px; padding: 18px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
.lp-dialog h4 { margin: 0; font-size: 17px; }
.lp-dialog p { margin: 0; font-size: 14px; color: #666; }
.lp-dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
.lp-empty { padding: 14px; color: #777; }

/* 分房表 demo (導領平台 APP) */
.rl { position: relative; margin: 0 auto; width: 100%; max-width: 390px; background: #f4f4f5; border: 1px solid #D9D9D9; border-radius: 14px; overflow: hidden; color: #1d1d1f; font-size: 14px; }
.rl button, .rl input, .rl textarea { font-family: inherit; }
.rl-top { background: #fff; border-bottom: 1px solid #e4e4e7; padding: 8px 8px 0; }
.rl-bar { display: flex; align-items: center; height: 40px; }
.rl-bar b { flex: 1; text-align: center; font-size: 17px; }
.rl-bar span { width: 44px; text-align: center; font-size: 12px; color: #52565c; }
.rl-date { display: flex; align-items: center; gap: 8px; padding: 6px 4px 12px; }
.rl-date .d { flex: 1; text-align: center; font-size: 18px; font-weight: 700; }
.rl-sq { width: 40px; height: 40px; border: 1px solid #d92b36; border-radius: 10px; background: #fff; color: #d92b36; font-size: 20px; cursor: pointer; line-height: 1; }
.rl-sq.fill { background: #d92b36; color: #fff; }
.rl-sp { width: 40px; flex: none; }
.rl-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.rl-hotel { background: #fde7ef; border: 1px solid #f6c6d8; border-radius: 14px; padding: 12px 14px; display: flex; gap: 8px; align-items: flex-start; }
.rl-hotel .z { font-size: 18px; font-weight: 700; }
.rl-hotel .e { font-size: 13px; color: #9a4f68; margin-top: 2px; }
.rl-pill { flex: none; margin-left: auto; font-size: 13px; font-weight: 700; padding: 4px 12px; border: 1px solid #f0aec6; border-radius: 999px; background: #fff; }
.rl-box { background: #fff; border: 1px solid #d4d5d9; border-radius: 14px; overflow: hidden; }
.rl-fin { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 0; background: #fff; cursor: pointer; text-align: left; font-size: 15px; font-weight: 700; }
.rl-fin small { font-size: 12px; color: #52565c; font-weight: 400; }
.rl-fin i { margin-left: auto; font-style: normal; color: #52565c; }
.rl-fintext { padding: 10px 14px 12px; border-top: 1px solid #eee; font-weight: 700; }
.rl-copy { background: #fff8ec; border: 1px solid #f0d9a8; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.rl-copy span { font-size: 13px; color: #7a5a16; }
.rl-copy div { display: flex; gap: 10px; }
.rl-b { flex: 1; height: 44px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid #c9ccd1; background: #fff; color: #1d1d1f; }
.rl-b.dark { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
.rl-room { background: #fff; border: 1px solid #d4d5d9; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.rl-rn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #1d1d1f; color: #fff; font-weight: 700; }
.rl-rn input { flex: 1; min-width: 0; height: 40px; padding: 0 10px; border: 1px solid #8a9098; border-radius: 8px; background: #fff; font-size: 16px; font-weight: 700; }
.rl-rn em { font-style: normal; font-size: 12px; color: #c9ccd1; font-weight: 400; }
.rl-rk { display: flex; gap: 10px; padding: 10px 12px; background: #f6f6f7; border-top: 1px solid #efeff1; align-items: flex-start; }
.rl-rk label { font-size: 13px; font-weight: 700; white-space: nowrap; }
.rl-rk label small { display: block; font-size: 10px; color: #7a7f86; font-weight: 400; }
.rl-rk textarea { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid #8a9098; border-radius: 8px; font-size: 13px; resize: none; }
.rl-p { padding: 8px 12px; border-top: 1px solid #efeff1; }
.rl-p b { font-size: 15px; margin-right: 8px; }
.rl-p span { font-size: 11px; color: #5b6067; }
.rl-p div { margin-top: 3px; font-size: 12px; color: #3f4348; }
.rl-need { background: #fff; border: 1px dashed #c9ccd1; border-radius: 14px; padding: 20px 14px; text-align: center; color: #52565c; }
.rl-need div { display: flex; gap: 10px; justify-content: center; margin: 12px 0 6px; }
.rl-need .rl-b { flex: none; padding: 0 18px; border-color: #1d1d1f; }
.rl-cnt { text-align: center; font-size: 13px; color: #3f4348; }
.rl-ok { color: #0b7a5a; font-weight: 700; }
.rl-bad { color: #b01e28; }
.rl-dl { width: 100%; height: 48px; border: 0; border-radius: 12px; background: #d92b36; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
.rl-pv { position: absolute; inset: 0; z-index: 3; background: #fff; display: flex; flex-direction: column; }
.rl-pvh { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #e4e4e7; font-weight: 700; }
.rl-pvh button { border: 0; background: transparent; font-size: 22px; cursor: pointer; width: 36px; height: 36px; }
.rl-pvh span { margin-left: auto; font-size: 12px; color: #52565c; font-weight: 400; }
.rl-pvb { flex: 1; min-height: 0; overflow: auto; position: relative; }
.rl-wm { position: absolute; inset: 0; z-index: 2; pointer-events: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='150'><text x='125' y='75' text-anchor='middle' transform='rotate(-24 125 75)' font-family='sans-serif' font-size='13' font-weight='700' fill='rgba(29,29,31,0.12)'>領隊 王小明　2026/11/10</text></svg>"); }
.rl-pvh2 { position: relative; z-index: 3; padding: 10px 14px; border-bottom: 1px solid #e4e4e7; background: #fff; font-size: 13px; }
.rl-tbl { position: relative; z-index: 3; background: #fff; overflow-x: auto; }
.rl-tbl table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12px; }
.rl-tbl th { background: #dbe9f6; text-align: left; padding: 7px 8px; border-right: 1px solid #cdd8e4; white-space: nowrap; }
.rl-tbl td { padding: 6px 8px; border-top: 1px solid #eef0f2; white-space: nowrap; }
.rl-pvn { position: relative; z-index: 3; background: #fff; font-size: 11px; color: #8a9098; padding: 6px 14px; }
.rl-pvf { position: relative; z-index: 3; background: #fff; border-top: 1px dashed #a1a5ab; padding: 12px 14px; font-size: 12px; line-height: 1.8; white-space: pre-line; }
.rl-pvt { padding: 10px 14px 16px; border-top: 1px solid #e4e4e7; }
.rl-pvt .rl-cnt { margin-bottom: 8px; }
.rl-toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(22,33,46,.92); color: #fff; padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 5; white-space: nowrap; }
.paperc { white-space: nowrap; } .thumb { padding: 0; border: 1px solid var(--line); background: #fff; border-radius: 4px; cursor: zoom-in; margin-right: 6px; } .thumb img { display: block; width: 64px; height: 90px; object-fit: cover; object-position: top; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <h1>交班文件 紙本與線上對照</h1>
  <p>選擇文件，查看過往紙本、導領平台與 SERP 的畫面。點選圖片可放大。</p>
</header>
<div class="chips-wrap"><div class="chips" id="chips" role="tablist" aria-label="交班文件"></div></div>
<main id="main"></main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="放大檢視">
  <div class="bar"><span id="lbCap"></span><button class="close" id="lbClose" type="button">關閉</button></div>
  <div class="scroll"><img id="lbImg" alt=""></div>
</div>

<script>
/* Data. Image paths are relative to this page. path = SERP menu path taken from the sheet "SERP交班項目". */
function I(f, cap) { return { src: 'img/' + f, cap: cap }; }

var SHOTS = [
  I('daily-shot-1.png', '飯店：選擇第幾天行程'), I('daily-shot-2.png', '行程：景點評分'), I('daily-shot-3.png', '導遊：評分'),
  I('daily-shot-4.png', '導遊：導遊名稱與評分'), I('daily-shot-5.png', '餐廳：用餐項目與評分'), I('daily-shot-6.png', '行程：暫存、送出第 1 天'),
  I('daily-shot-7.png', '餐廳：評分與照片'), I('daily-shot-8.png', '飯店：評分與暫存'), I('daily-shot-9.png', '餐廳：項目清單')
];

var PAPER = {
  '收件一覽表': [I('paper-intake.png', '團體收件一覽表（紙本，第 1 頁，共 2 頁）')],
  '合約書': [I('paper-contract.png', '團體規格書（紙本，第 1 頁，共 2 頁；領隊、導遊欄位已模糊）')],
  '開票名單': [I('paper-invoice.png', '開票名單（紙本，第 1 頁，共 2 頁）'), I('paper-invoice-mid.png', '開票名單（有中段名單）')],
  'Q 信箱': [I('paper-qbox.png', 'Q 信箱列印（紙本，第 1 頁，共 5 頁；人名與內容已模糊）')]
};
var HANDOVER = [

/* ---------- images and lightbox ---------- */

function drawItem(tab, items, it, idx) {
